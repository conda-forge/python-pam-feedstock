schema_version: 1

context:
  name: python-pam
  version: "2.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: d5bf50bd619a7d93514149a34aa4e4f9f174c90b38ec9657054f6a2017f65bb5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=2.0
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pam
      pip_check: true
      python_version:
        - "${{ python_min }}.*"
        - "*"

about:
  summary: Python PAM module using ctypes, py3
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/FirefighterBlu3/python-pam

extra:
  recipe-maintainers:
    - timkpaine
